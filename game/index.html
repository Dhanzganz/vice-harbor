<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Harbor — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0e1a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", system-ui, sans-serif; }
  #stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 10; }
  canvas { display: block; width: 100%; height: 100%; background: #10182b; cursor: crosshair; }
  #fallback { color: #f5e9d0; text-align: center; padding: 2rem; line-height: 1.5; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="800"></canvas>
  <noscript><div id="fallback">Vice Harbor needs JavaScript. It is a complete open-world crime game that runs entirely from this folder, offline.</div></noscript>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
