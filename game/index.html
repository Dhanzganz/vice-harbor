<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Vice Harbor: a top-down open-world crime sandbox in one HTML file. Steal cars, dodge the harbor patrol, work for Marla Vane.">
<title>Vice Harbor — a tiny open-world crime sandbox</title>
<style>
  html, body { margin: 0; padding: 0; background: #07080f; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #cfe0ee; }
  canvas { width: min(1280px, 100vw); height: auto; aspect-ratio: 1280 / 800; background: #0b1026;
           border: 1px solid #232a38; border-radius: 6px; box-shadow: 0 18px 60px rgba(0,0,0,0.6); }
  p { margin: 0; font-size: 13px; opacity: 0.75; text-align: center; padding: 0 12px; }
  b { color: #ffd650; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<p><b>Vice Harbor</b> — WASD/arrows move &amp; drive · Shift run · F punch · mouse aim &amp; click shoot ·
   E enter car / talk · P pause. Do five jobs for Marla Vane at The Rusty Anchor. Fully offline, no assets, all drawn &amp; sounded in code.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
